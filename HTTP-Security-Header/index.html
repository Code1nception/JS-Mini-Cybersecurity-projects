<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HTTP Security Header Analyzer</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <div class="container">

        <header>

            <div class="tag">
                CYBERSECURITY TOOL
            </div>

            <h1>🛡 HTTP Security Header Analyzer</h1>

            <p>
                Analyze HTTP responses and inspect important security headers.
            </p>

        </header>


        <section class="input-box">

            <input
                id="url-input"
                type="url"
                placeholder="Enter URL e.g. https://example.com"
            >

            <button id="inspect-btn">
                Analyze URL
            </button>

        </section>


        <section id="results">

            <div class="welcome">

                <div class="icon">🔍</div>

                <h2>Ready to Analyze</h2>

                <p>
                    Enter a URL above to inspect its HTTP response,
                    security headers, and security score.
                </p>

            </div>

        </section>

    </div>


    <footer>
        HTTP Security Header Analyzer • Built with HTML, CSS & Vanilla JavaScript
    </footer>


    <script src="./script.js"></script>

</body>

</html>
